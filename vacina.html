<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaisVacina — Minhas Vacinas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="pages.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="topo-governo">
        <div class="logos-publicos">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/05/Gov.br_logo.svg/320px-Gov.br_logo.svg.png" alt="Governo Federal">
        </div>
        <div class="logo-principal">
            <a href="app.html" style="text-decoration:none;"><h1>Mais<span>Vacina</span></h1></a>
        </div>
        <div class="usuario-info" id="usuario-info">
            <span>Olá, <strong id="nome-usuario">Paciente</strong></span>
            <button id="btn-logout" class="btn-logout">Sair</button>
        </div>
    </header>

    <nav class="nav-interna">
        <a href="app.html">🏠 Início</a>
        <a href="perfil.html">👤 Meus Dados</a>
        <a href="vacinas.html" class="ativo">💉 Minhas Vacinas</a>
        <a href="autenticacao.html">🩺 Área Profissional</a>
        <a href="sobre.html">ℹ️ Sobre</a>
    </nav>

    <div id="app-main">
        <main>
            <section class="card">
                <h2>💉 Minhas Vacinas</h2>
                <p>Registre aqui as vacinas que você já tomou.</p>

                <form id="form-vacina">
                    <div class="grid-2">
                        <div class="campo">
                            <label for="vacina-nome">Vacina *</label>
                            <input type="text" id="vacina-nome" required placeholder="Ex.: COVID-19, Gripe, Hepatite B...">
                        </div>
                        <div class="campo">
                            <label for="vacina-data">Data da vacinação *</label>
                            <input type="date" id="vacina-data" required>
                        </div>
                        <div class="campo">
                            <label for="vacina-hora">Horário *</label>
                            <input type="time" id="vacina-hora" required>
                        </div>
                        <div class="campo">
                            <label for="vacina-local">Local da vacinação *</label>
                            <input type="text" id="vacina-local" required placeholder="Hospital, UBS, farmácia...">
                        </div>
                    </div>
                    <button type="submit" class="btn-primario">Adicionar Vacina</button>
                </form>

                <h3>Histórico</h3>
                <div id="lista-vacinas">
                    <p class="vazio">Nenhuma vacina registrada ainda.</p>
                </div>
            </section>
        </main>
    </div>

    <footer class="rodape-parceiros">
        <p class="nota-rodape">Projeto demonstrativo. As marcas pertencem aos seus respectivos proprietários.</p>
    </footer>

    <script src="script.js"></script>
    <script src="pages.js"></script>
</body>
</html>
